[project]
name = "resonance-help-desk"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".claude", "chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/rag.py" = ["E501"]  # the system prompt is kept one rule per line
